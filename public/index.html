
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internship Tracking</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
    <div class="brand">Internship Tracking</div>
    <div class="topbar-right">
        <span class="status">● ระบบพร้อมใช้งาน</span>
        <span class="user-info" id="userInfo"></span>
        <form method="POST" action="/logout" class="logout-form">
            <button type="submit" class="logout-btn">ออกจากระบบ</button>
        </form>
    </div>
</header>

<main class="container">
    <h1>ระบบติดตามการฝึกงาน<br>และสหกิจศึกษา</h1>
    </p>

    <section class="stats">
        <article class="card">
            <p>นักศึกษาทั้งหมด</p>
            <h2 id="studentCount">0</h2>
        </article>
        <article class="card">
            <p>การสมัครฝึกงาน</p>
            <h2 id="applicationCount">0</h2>
        </article>
        <article class="card">
            <p>ระบบฐานข้อมูล</p>
            <h2 id="databaseStatus">ยังไม่เชื่อมต่อ</h2>
        </article>
    </section>

</main>

<script>
    fetch("/api/me")
        .then((res) => res.json())
        .then((data) => {
            if (data.username) {
                document.getElementById("userInfo").textContent =
                    `${data.username} (${data.role})`;
            }
        });
</script>
</body>
</html>
